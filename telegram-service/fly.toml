app = "crm-telegram-service"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  TDLIB_DATA_DIR = "/data/tdlib"

[[mounts]]
  source = "tdlib_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options.response]
    pristine = true

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
